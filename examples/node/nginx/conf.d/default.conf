# Catch-all servers: anything that does not match a real vhost lands here.

server {
    listen 80 default_server;
    server_name _ "";

    access_log /dev/null;
    error_log  /var/log/nginx/default.error.log warn;

    # Also how a new domain gets its first certificate: the http-01
    # challenge is answered here before the domain has a vhost.
    include snippets/acme.conf;

    location / {
        return 444;
    }
}

# HTTPS with unknown or absent SNI - in practice, scans by IP. Without this
# block nginx falls back to the FIRST vhost loaded from conf.d, and a scan by
# IP reaches whatever that is, an admin UI included, with nothing in the
# logs pointing at it. ssl_reject_handshake aborts TLS before any HTTP, so
# no certificate is needed here.
server {
    listen 443 ssl default_server;
    server_name _ "";

    ssl_reject_handshake on;
}
