# Restore map: what comes back from which archive, under which name and
# address, and in which order. zk2-deploy copies it to /etc/zk2/restore.conf.
#
# Format, whitespace separated:
#   archive-prefix  name  address  wave  [image]
#
#   archive-prefix  "NAME@" - zk2-backup names archives NAME@STAMP; the newest
#                   archive with the prefix is restored
#   address         ipv4.address of eth0 on the instance bridge
#   wave            order on the day of a disaster: zk2-restore wave 1, then
#                   2, ... Front first, so sites answer as soon as their
#                   backends return; VPN next, so you can reach the rest
#   image           base image the container is created from before its root
#                   is replaced (RESTORE_IMAGE in node.conf by default). Only
#                   its type matters much - the archive replaces its files
#
# Keep it current together with the inventory: on the day it is needed,
# nobody remembers the addresses.
#
# prefix    name      address       wave
nginx@      nginx     10.20.0.10    1
openvpn@    openvpn   10.20.0.20    2
app@        app       10.20.0.30    3
