# Node parameters: everything that makes this installation different from any
# other. The tools read it from /etc/zk2/node.conf (ZK2_CONF_DIR overrides the
# directory). Plain shell variable assignments, sourced by bash.
#
# This is a fictional node. Addresses are from the documentation ranges
# (RFC 5737); replace them with yours.

# ssh alias zk2-deploy uses to reach the node as root. Defaults to the name
# of the node directory, so with "Host node1" in ~/.ssh/config it can stay
# unset.
#SSH_HOST=node1

# Public address of the node, the one ports are published on.
PUBLIC_IP=203.0.113.10

# Incus bridge the instances live on, and its network.
#
# If you run more than one node and connect them over a VPN, give every node
# its own instance network: identical networks on two nodes make routing
# between them impossible.
CT_BRIDGE=zk2br0
CT_NET=10.20.0.0/24

# Pool of OpenVPN client addresses (the openvpn instance hands them out).
VPN_NET=10.20.100.0/24

# ZFS pool the instances live on. zk2-health reports it missing; all pools of
# the node are checked for health regardless.
ZFS_POOL=tank

# zk2-health thresholds and instance names, shown with their defaults.
#POOL_PCT=85            # pool usage, %
#MEM_PCT=90             # instance memory usage, % of its limit
#NGINX_CT=nginx         # front instance with Let's Encrypt certificates
#CERT_DAYS=14
#VPN_CT=openvpn         # OpenVPN instance
#VPN_CERT_DAYS=30
#CRL_DAYS=14
#NESTED_OOM_OK=""       # instances where OOM kills in nested cgroups are routine
#NODE_NAME=node1        # name in the mail subject; hostname by default
#MAIL_WHEN=always       # always: mail every night; problems: only with findings

# zk2-backup: retention and schedule, shown with their defaults.
#KEEP_DAILY=7           # daily/weekly policy: archives kept per instance
#KEEP_WEEKLY=4
#KEEP_MONTHLY=6
#WEEKLY_DAY=7           # weekly policy runs on this day, 1 = Monday ... 7 = Sunday
#MONTHLY_DAYS=30        # monthly policy: new archive when the last is this old
#MONTHLY_KEEP=2         # monthly policy: archives kept
#EXPORT_TMP=/var/tmp    # where a monthly VM is exported before borg reads it
