# Node parameters: everything that makes this installation different from any
# other. The tools read it from /etc/zk2/node.conf (ZK2_CONF_DIR overrides the
# directory). Plain shell variable assignments, sourced by bash.
#
# This is a fictional node. Addresses are from the documentation ranges
# (RFC 5737); replace them with yours.

# Public address of the node, the one ports are published on.
PUBLIC_IP=203.0.113.10

# Incus bridge the instances live on, and its network.
#
# If you run more than one node and connect them over a VPN, give every node
# its own instance network: identical networks on two nodes make routing
# between them impossible.
CT_BRIDGE=zk2br0
CT_NET=10.20.0.0/24

# Pool of OpenVPN client addresses (the openvpn instance hands them out).
VPN_NET=10.20.100.0/24
