# Node parameters: everything that makes this installation different from any
# other. The tools read it from /etc/zk2/node.conf (ZK2_CONF_DIR overrides the
# directory). Plain shell variable assignments, sourced by bash.
#
# This is a fictional node. Addresses are from the documentation ranges
# (RFC 5737); replace them with yours.

# ssh alias zk2-deploy uses to reach the node as root. Defaults to the name
# of the node directory, so with "Host node1" in ~/.ssh/config it can stay
# unset.
#SSH_HOST=node1

# Public address of the node, the one ports are published on.
PUBLIC_IP=203.0.113.10

# sshd port of the node itself. zk2-node-build's firewall drops everything
# else: change the port in sshd and here together, or the next firewall run
# locks you out.
SSH_PORT=22

# Disks (or spare partitions) for the ZFS mirror that holds the instances.
# The OS lives elsewhere - on its own small RAID, as the provider installed
# it. zk2-node-build refuses disks with any signature on them unless --force.
# Prefer /dev/disk/by-id/... for SATA disks, whose letters can change.
ZFS_DISKS="/dev/nvme0n1p4 /dev/nvme1n1p4"

# Incus bridge the instances live on, and its network.
#
# If you run more than one node and connect them over a VPN, give every node
# its own instance network: identical networks on two nodes make routing
# between them impossible.
CT_BRIDGE=zk2br0
CT_NET=10.20.0.0/24
#CT_GATEWAY=10.20.0.1   # address of the bridge; the first of CT_NET by default

# VPN, optional. VPN_NET is the pool of OpenVPN client addresses, VPN_CT_IP
# the address of the OpenVPN instance. With both set, zk2-node-build routes
# the VPN pool through that instance (on the node and, by DHCP, inside every
# instance) and zk2-health checks both routes. Leave them unset without VPN.
VPN_NET=10.20.100.0/24
VPN_CT_IP=10.20.0.20

# Own domains resolved to an internal address from inside, "name=address"
# separated by spaces. An instance that calls its own public domain would
# otherwise go out to the node's public address and back in through DNAT,
# which does not work - the connection hangs until it times out. Exact names
# only, subdomains are not included.
#DNS_SPLIT="example.org=10.20.0.10 www.example.org=10.20.0.10"

# Incus from the Zabbly repository, this channel.
#INCUS_CHANNEL=lts-7.0

# New instances (zk2-new-ct, profile base built by zk2-base-profile).
#CT_USER=admin                 # user created in every instance, with sudo
#CT_SSH_PASSWORD=yes           # ssh with passwords (passwords in zk2-env)
#CT_SSH_ROOT=prohibit-password # root over ssh: yes, prohibit-password or no
# Public keys put into the user's and root's authorized_keys, one per line.
#CT_SSH_KEYS="ssh-ed25519 AAAA... admin@laptop"

# ZFS pool the instances live on. zk2-health reports it missing; all pools of
# the node are checked for health regardless.
ZFS_POOL=tank

# zk2-health thresholds and instance names, shown with their defaults.
#POOL_PCT=85            # pool usage, %
#MEM_PCT=90             # instance memory usage, % of its limit
#NGINX_CT=nginx         # front instance with Let's Encrypt certificates
#CERT_DAYS=14
#VPN_CT=openvpn         # OpenVPN instance
#VPN_CERT_DAYS=30
#CRL_DAYS=14
#NESTED_OOM_OK=""       # instances where OOM kills in nested cgroups are routine
#NODE_NAME=node1        # name in the mail subject; hostname by default
#MAIL_WHEN=always       # zk2-nightly (and --mail): always every night, or problems only

# zk2-backup: retention and schedule, shown with their defaults.
#KEEP_DAILY=7           # daily/weekly policy: archives kept per instance
#KEEP_WEEKLY=4
#KEEP_MONTHLY=6
#WEEKLY_DAY=7           # weekly policy runs on this day, 1 = Monday ... 7 = Sunday
#MONTHLY_DAYS=30        # monthly policy: new archive when the last is this old
#MONTHLY_KEEP=2         # monthly policy: archives kept
#EXPORT_TMP=/var/tmp    # where a monthly VM is exported before borg reads it
#BORG_COMPACT=yes       # free pruned space nightly; "no" if the storage keeps snapshots

# zk2-restore: image a container is created from before its root is replaced.
#RESTORE_IMAGE=images:debian/13

# zk2-archives: an archive older than this (hours) is reported stale.
#FRESH_DAILY_H=30
#FRESH_WEEKLY_H=192
#FRESH_MONTHLY_H=840

# zk2-send: where an archive is unpacked before it is streamed to a peer.
#SEND_POOL=tank          # ZFS_POOL by default; a separate pool keeps the mirror free
