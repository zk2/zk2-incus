# Backup inventory: which instances are backed up, how often, and with which
# hook. zk2-deploy copies it to /etc/zk2/inventory.conf.
#
# Format, whitespace separated:
#   name  policy  hook
#
#   policy  daily    every night
#           weekly   on WEEKLY_DAY (node.conf, 1 = Monday ... 7 = Sunday)
#           monthly  when the last archive is older than MONTHLY_DAYS; the last
#                    MONTHLY_KEEP are kept. For what rarely changes but must
#                    survive the loss of the disks. A VM on this policy is
#                    exported whole (incus export), so it comes back bootable.
#           none     deliberately not backed up (reproducible, or backed up
#                    elsewhere)
#           todo     not decided yet: reported every night as unprotected
#   hook    pre-backup hook from /etc/zk2/hooks or /opt/zk2/hooks, or "-"
#
# Every instance on the node must be listed, "none" included: zk2-health and
# zk2-backup report instances missing from here, because a new instance that
# silently stays without backup is the failure this file exists to prevent.
# Add the line on the day the instance appears, not in advance - a listed
# instance that is not on the node is reported as missing too.
#
# name      policy   hook
nginx       daily    -
openvpn     daily    -              # PKI: losing it means reissuing every client
app         daily    dump-postgres
cache       none     -              # rebuilt from scratch in minutes
