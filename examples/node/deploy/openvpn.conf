# Role openvpn on this node: the VPN scripts into /usr/local/bin of the
# openvpn instance. The server itself is set up there with zk2-vpn-setup
# (see containers/openvpn/README.md); a mistake in it cuts off every client,
# so it is not part of a routine deploy.
NAME=openvpn
DEST=/usr/local
FILES="bin"
CHECK="zk2-vpn-show >/dev/null 2>&1 || ls -l /usr/local/bin/zk2-vpn-setup"
