# Role nginx on this node: which instance gets which files.
# "zk2-deploy NODE nginx" pushes them and runs CHECK, then RELOAD.
#
# FILES come from zk2 containers/nginx/ (the same on every node): nginx.conf
# and the snippets. NODE_FILES come from this fleet, nodes/<node>/nginx/:
# the vhosts of this node. A vhost of another node in a shared directory
# fails in the worst way - nginx -t does not care whether an upstream exists,
# so it deploys fine and breaks on the first request.
NAME=nginx
DEST=/etc/nginx
FILES="nginx.conf snippets"
NODE_FILES="conf.d"
CHECK="nginx -t"
# reload-or-restart, not "nginx -s reload": the latter only signals a running
# nginx and fails on a fresh front whose service was never started (the
# nginx.org package does not start it). A running nginx is reloaded, a
# stopped one started.
RELOAD="systemctl reload-or-restart nginx"
