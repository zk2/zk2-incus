# Which ACLs are attached to which instance NIC. The rule list itself is a
# network object (acl-*.yaml); attaching it is instance configuration, so it
# lives here.
#
# Format:  instance  device  acl[,acl...]
#
# Attaching an ACL turns on default reject in BOTH directions. zk2-publish
# sets security.acls.default.egress.action=allow on the device so the
# instance keeps its outgoing traffic; ingress is up to the ACL.
#
# instance   device   acl
app          eth0     deploy
