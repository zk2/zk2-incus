# For the nginx.org packages (user nginx, stream module built in). Debian's own
# nginx runs as www-data and ships stream as a separate module - see README.md.
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 16384;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

# Dynamic module configs where the packaging has them (RHEL family); on
# Debian the glob matches nothing, which nginx accepts.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the nginx version in headers and error pages.
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      '"$upstream_addr" "$upstream_status" $request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    client_max_body_size 120m;

    # HTTP/2 for every "listen ... ssl" server (nginx 1.25.1+ syntax).
    http2 on;

    # ---- TLS policy -------------------------------------------------------
    # Shared by every vhost. Individual servers only declare their own
    # ssl_certificate / ssl_certificate_key.
    #
    # No ssl_stapling: Let's Encrypt no longer publishes an OCSP responder
    # URL in its certificates, so enabling it only produces a startup warning
    # per vhost and buys nothing.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:50m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- Proxy defaults ---------------------------------------------------
    # WARNING: proxy_set_header does NOT merge across levels. A location that
    # declares any proxy_set_header of its own discards every one of these.
    # Such locations must include snippets/proxy.conf, which repeats them.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout       10s;
    proxy_send_timeout          1800s;
    proxy_read_timeout          1800s;
    send_timeout                1800s;
    proxy_max_temp_file_size    0;

    # No resolver: nothing needs it any more. proxy_pass targets are either
    # literal IPs or hostnames without variables (resolved once at startup
    # via /etc/resolv.conf). Add one back only if an upstream by hostname or
    # a proxy_pass with variables is introduced.

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/plain text/css text/xml text/javascript
                      application/json application/javascript application/xml
                      application/xml+rss application/rss+xml image/svg+xml;

    include /etc/nginx/snippets/maps.conf;
    include /etc/nginx/conf.d/*.conf;
}

# Plain TCP relays (git over ssh to an instance, for example), next to http
# rather than inside it, which is why they cannot live in conf.d. Nodes
# without relays have no stream.d: the glob matches nothing, which nginx
# accepts.
stream {
    include /etc/nginx/stream.d/*.conf;
}
