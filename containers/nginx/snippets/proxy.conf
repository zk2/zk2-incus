# Baseline proxy headers.
#
# These repeat the http-level defaults from nginx.conf. Include this file in
# any location that declares proxy_set_header directives of its own, because
# doing so discards every inherited proxy_set_header.

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
