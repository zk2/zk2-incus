# Shared map blocks. Included from the http context in nginx.conf.

# WebSocket upgrade. Sending "Connection: upgrade" unconditionally breaks
# plain HTTP requests, so mirror whatever the client actually asked for:
#     proxy_set_header Upgrade    $http_upgrade;
#     proxy_set_header Connection $connection_upgrade;
#     include snippets/proxy.conf;
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Skip access logging for static asset requests:
#     access_log /var/log/nginx/NAME.access.log main if=$loggable;
map $request_uri $loggable {
    default    1;
    ~^/assets/ 0;
}
