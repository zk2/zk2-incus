# ACME http-01 challenge webroot.
#
# "^~" is a prefix match with priority over regexes, unlike the old
# "location ~ /\.well-known" which was an unanchored regex and therefore
# matched .well-known anywhere in the URI, for example /api/x/.well-known/y.

location ^~ /.well-known/acme-challenge/ {
    root /var/www/html/default;
}
