# Maintenance stub.
#
# Include it as the first line of a location to take that location offline:
# the return fires during the rewrite phase, so proxy_pass below it never
# runs and can stay in place.
#
#     location / {
#         include snippets/maintenance.conf;
#         proxy_pass http://10.20.0.30:8080/;
#     }
#
# Comment the include out again to bring the site back.

default_type text/plain;
return 200 "The website is under construction...\n";
